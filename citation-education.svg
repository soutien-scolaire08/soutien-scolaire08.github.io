  <text x="88" y="92" fill="#ffd166" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">UNE PENSÉE SUR L’ÉDUCATION</text>
  <text x="88" y="197" fill="#fff" font-family="Georgia,serif" font-size="57" font-weight="700">
    <tspan x="88" dy="0">« Si vous pensez que</tspan>
    <tspan x="88" dy="72">l’éducation coûte cher,</tspan>
    <tspan x="88" dy="72">essayez l’ignorance. »</tspan>
  </text>
