<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Citation sur l’éducation de Robert Orben</title>
  <desc id="desc">Si vous pensez que l’éducation coûte cher, essayez l’ignorance.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#262334"/><stop offset="1" stop-color="#111014"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4dd0e1"/><stop offset="1" stop-color="#2787ff"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#glow)"/>
  <circle cx="1010" cy="195" r="138" fill="#302d3b" opacity=".55"/>
  <path d="M895 445c36-105 99-160 186-160s150 55 186 160v95H895z" fill="#24212b"/>
  <circle cx="1080" cy="233" r="72" fill="#d7d2ca"/>
